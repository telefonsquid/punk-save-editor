# Builds the desktop app for every OS/arch pair and attaches the bundles to a
# draft GitHub release. Publish flow (details in CLAUDE.md "Releasing"): write
# the CHANGELOG.md section, `bun run version:set <version>`, commit, push a tag
# like v1.0.0. The notes are filled in from the changelog below — review the
# draft on GitHub and publish; never write notes by hand.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            # MSI + NSIS installers, plus the bare exe uploaded as portable below.
            args: --target x86_64-pc-windows-msvc
            portable: x64
          - name: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            # Cross-compiled. WiX can't produce ARM64 MSIs, so NSIS only.
            args: --target aarch64-pc-windows-msvc --bundles nsis
            portable: arm64
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            # dmg only. "all" would add the .app.tar.gz updater bundle, which
            # nothing consumes — the app checks for releases but never installs
            # one (src/lib/update.ts).
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ''

    runs-on: ${{ matrix.runner }}

    steps:
      # v5 for Node 24. v4 still runs, but every job it touches gets a
      # deprecation annotation that reads like a build problem in the email.
      - uses: actions/checkout@v5

      # xdg-utils is not optional: the app opens links through tauri-plugin-opener,
      # so the AppImage bundler pulls xdg-open into the image and fails the whole
      # build without it. The x64 runner image happens to ship it and the ARM one
      # does not, which is why only linux-arm64 ever noticed.
      - name: Install Linux system dependencies
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xdg-utils

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # A tag that disagrees with the version in the app is worth failing on
      # here rather than shipping installers that name the wrong release.
      - name: Check the tag against the app version
        shell: bash
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match package.json $version"
            echo "run: bun run version:set $version"
            exit 1
          fi

      # The notes come out of CHANGELOG.md, which is also what the app's
      # /changelog page renders. Fails the build if the tag has no section.
      - name: Read release notes from the changelog
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<PUNK_EOF'
            bun run --silent release-notes "${{ github.ref_name }}"
            echo 'PUNK_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PUNK Save Editor v__VERSION__'
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---

            Pick the file for your system below. The `-portable.exe` runs without
            installation. macOS builds are unsigned: right-click the app and
            choose Open on first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The NSIS/MSI bundles wrap this same exe. Tauri apps are self-contained,
      # so the bare exe from the build tree is the portable version. This one is
      # named on the spot rather than by the rename job below, since nothing here
      # has to guess what it is.
      - name: Upload portable exe
        if: startsWith(matrix.name, 'windows')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dest = "punk-save-editor_${version}_windows_${{ matrix.portable }}_portable.exe"
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/punk-save-editor.exe" $dest
          gh release upload "${{ github.ref_name }}" $dest --clobber

  # Every bundler names its output by its own platform convention — amd64 on a
  # deb, x86_64 on an rpm, aarch64 on a dmg, a locale on the msi — and none of
  # them can be told otherwise. One pass over the finished release is where the
  # whole set can be made to match. Runs even when a build failed, so a partial
  # release is still consistent in what it did manage to upload.
  rename:
    name: Normalise asset names
    needs: build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - name: Give every asset the same version_os_arch name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run rename-release-assets "${{ github.ref_name }}"
