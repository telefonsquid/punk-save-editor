server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Every file under _app/immutable carries a content hash in its name,
    # so a stale copy is impossible.
    location /_app/immutable/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fonts, icons and the extracted game art keep their names across releases.
    # Let the browser revalidate so a new version actually reaches it.
    location ~* \.(woff2?|ttf|png|jpe?g|svg|ico|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # The site renders client side, so routes like /changelog exist only once
    # the app has booted. Everything unknown resolves to the shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
